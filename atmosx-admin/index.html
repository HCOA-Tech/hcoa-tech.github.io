<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AtmosX 管理后台</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0e17; --panel:#121826; --panel2:#0e1420;
    --line:rgba(148,180,255,.10); --line2:rgba(148,180,255,.18);
    --txt:#eef2fb; --mut:#8b96ad; --dim:#5c6678;
    --acc:#38bdf8; --acc2:#7c8cf8;
    --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:
      radial-gradient(1100px 500px at 78% -8%, rgba(56,189,248,.10), transparent 58%),
      radial-gradient(800px 420px at -6% 8%, rgba(124,140,248,.08), transparent 55%),
      var(--bg);
    color:var(--txt); min-height:100vh;
    padding:0 30px 48px;
  }
  a{color:var(--acc)}

  /* ===== 顶栏 ===== */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:20px 0 16px; border-bottom:1px solid var(--line); margin-bottom:22px;
  }
  .brand{display:flex; align-items:center; gap:13px}
  .logo{
    width:38px;height:38px;border-radius:10px; flex:none;
    background:linear-gradient(135deg,#0ea5e9 0%,#6366f1 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(56,130,246,.30);
  }
  .logo svg{width:21px;height:21px}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  .brand .sub{color:var(--mut);font-size:12px;margin-top:2px}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status{
    display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);
    padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:rgba(148,180,255,.05);
  }
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
  .status.ok{color:#a7f3d0;border-color:rgba(52,211,153,.35)}
  .status.ok .dot{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.8)}
  .status.err{color:#fecaca;border-color:rgba(248,113,113,.35)}
  .status.err .dot{background:var(--err)}
  .keyrow{display:flex;align-items:center;gap:8px}
  .keyrow .lbl{font-size:11.5px;color:var(--mut);margin-right:2px}

  /* ===== 输入与按钮 ===== */
  input,textarea{
    background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:8px 11px;font-size:13px;outline:none;width:100%;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus,textarea:focus{border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  input.mono{font-family:var(--mono)}
  input#keyInput{width:190px}
  button{
    font-family:inherit;border:none;border-radius:8px;cursor:pointer;font-size:13px;
    padding:8px 16px;color:#fff;transition:filter .15s, transform .05s, background .15s;
  }
  button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(135deg,#0ea5e9,#6366f1);box-shadow:0 3px 12px rgba(56,130,246,.25)}
  .btn-ghost{background:rgba(148,180,255,.07);color:var(--txt);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(148,180,255,.13)}
  .btn-danger{background:linear-gradient(135deg,#e11d48,#f43f5e)}
  .btn-sm{padding:4px 10px;font-size:12px;border-radius:7px}
  .btn-link{background:none;border:none;color:var(--acc);font-size:12px;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .btn-link:hover{filter:none;color:#7dd3fc}
  #connBtn.ok{
    background:rgba(52,211,153,.12);color:#6ee7b7;border:1px solid rgba(52,211,153,.4);
    box-shadow:none;cursor:default;filter:none;
  }
  #connBtn.bad{
    background:rgba(248,113,113,.12);color:#fca5a5;border:1px solid rgba(248,113,113,.4);
    box-shadow:none;
  }

  /* ===== 统计卡 ===== */
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:20px}
  .stat{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .stat .n{font-size:26px;font-weight:700;font-family:var(--mono);letter-spacing:.3px;line-height:1.2}
  .stat .l{font-size:12px;color:var(--mut);margin-top:4px}
  .stat .hint{font-size:11px;color:var(--dim);margin-top:5px;min-height:14px}

  /* ===== 标签页 ===== */
  .tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tabs button{
    background:none;color:var(--mut);border-radius:8px 8px 0 0;padding:9px 16px;font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tabs button:hover{filter:none;color:var(--txt);background:rgba(148,180,255,.05)}
  .tabs button.active{
    color:#e0f2fe;border-bottom-color:var(--acc);background:rgba(56,189,248,.07);
  }

  /* ===== 卡片 ===== */
  .panel{display:none}
  .panel.show{display:block}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin-bottom:14px;
  }
  .card h2{font-size:14px;margin:0 0 14px;font-weight:600;display:flex;align-items:baseline;gap:8px}
  .card h2 .mut{font-weight:400}

  /* ===== 表单行 ===== */
  .row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1;min-width:160px}
  .row > div.fix{flex:0 0 auto}
  label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px}
  .hintline{font-size:11.5px;color:var(--dim);margin-top:5px}
  .code-box{
    font-family:var(--mono);font-size:15px;letter-spacing:2px;padding:13px 16px;
    background:var(--panel2);border:1px solid var(--line2);border-radius:10px;margin-top:12px;
    display:inline-block;color:#7dd3fc;word-break:break-all;cursor:pointer;
  }
  .code-box:hover{border-color:rgba(56,189,248,.5)}
  .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  .ok{color:var(--ok)} .err{color:var(--err)}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(148,180,255,.07)}
  th{color:var(--mut);font-weight:500;font-size:11px;letter-spacing:.4px;white-space:nowrap}
  tbody tr:hover{background:rgba(148,180,255,.04)}
  .devsub td{padding:6px 12px;background:rgba(10,14,23,.45)}
  .mono{font-family:var(--mono);font-size:12px}
  .mut{color:var(--mut)}

  /* ===== 状态胶囊 ===== */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500}
  .pill .d{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}
  .pill.on{background:rgba(52,211,153,.12);color:#6ee7b7}
  .pill.off{background:rgba(248,113,113,.10);color:#fca5a5}
  .pill.warn{background:rgba(251,191,36,.10);color:#fcd34d}
  .pill.gray{background:rgba(148,180,255,.10);color:var(--mut)}

  /* ===== 进度条 ===== */
  .bar2{height:5px;background:rgba(148,180,255,.12);border-radius:3px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle}
  .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#818cf8);border-radius:3px}
  .bar-label{font-size:11.5px;color:var(--mut);margin-left:8px;vertical-align:middle;font-family:var(--mono)}

  /* ===== 事件日志时间线 ===== */
  .timeline{position:relative;padding-left:20px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,rgba(56,189,248,.4),transparent)}
  .tl-item{position:relative;padding:7px 0 7px 14px}
  .tl-item::before{content:"";position:absolute;left:-19px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
  .tl-item .t{font-size:12.5px}
  .tl-item .d{font-size:11px;color:var(--dim);margin-top:2px}
  .badge{font-size:10.5px;padding:2px 8px;border-radius:6px;background:rgba(56,189,248,.13);color:var(--acc);margin-right:8px}

  .btnrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  details summary{cursor:pointer;color:var(--mut);font-size:12.5px}
  .empty{color:var(--mut);padding:20px 0;text-align:center;font-size:13px}
  pre{white-space:pre-wrap}

  /* ===== 页脚 ===== */
  .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:11.5px;padding-top:6px}
  .foot .mono{font-size:11.5px}

  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);
    padding:11px 18px;border-radius:10px;font-size:13px;z-index:99;max-width:70vw;
    background:#161f31;border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:rgba(52,211,153,.45);color:#6ee7b7}
  .toast.err{border-color:rgba(248,113,113,.45);color:#fca5a5}

  @media (max-width:960px){
    .stats{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:640px){
    body{padding:0 14px 40px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .keyrow{width:100%}
    input#keyInput{flex:1;width:auto}
  }
</style>
</head>
<body>

<!-- ================= 顶栏 ================= -->
<div class="topbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12c2-4 4-4 6 0s4 4 6 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6 9c1.5-2.5 3-2.5 4.5 0S12.5 12 14 9s3-2.5 4.5 0" stroke="#a5f3fc" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.1" fill="#fff"/>
      </svg>
    </div>
    <div>
      <h1>AtmosX 管理后台</h1>
      <div class="sub" id="subStatus">授权 · 激活码 · 设备 · 日志</div>
    </div>
  </div>

  <div class="top-right">
    <span class="status" id="connHint"><span class="dot"></span>未连接</span>
    <div class="keyrow">
      <span class="lbl">管理员密钥</span>
      <input id="keyInput" type="password" class="mono" placeholder="输入管理员密钥后回车连接" autocomplete="off">
      <button class="btn-primary" id="connBtn" onclick="saveKey()">连接</button>
      <button class="btn-link" onclick="clearKey()" title="清除本机保存的密钥">清空密钥</button>
    </div>
    <button class="btn-ghost" onclick="loadAll()">刷新数据</button>
  </div>
</div>

<!-- ================= 统计 ================= -->
<div class="stats">
  <div class="stat"><div class="n" id="sCodes">–</div><div class="l">激活码</div><div class="hint" id="sCodesHint"></div></div>
  <div class="stat"><div class="n" id="sDevices">–</div><div class="l">已绑定设备</div><div class="hint" id="sDevicesHint"></div></div>
  <div class="stat"><div class="n" id="sOnline">–</div><div class="l">在线设备</div><div class="hint">5 分钟内有心跳</div></div>
  <div class="stat"><div class="n" id="sPreset">–</div><div class="l">预设分布</div><div class="hint" id="sPresetHint">最近一次心跳上报</div></div>
  <div class="stat"><div class="n" id="sVer">–</div><div class="l">当前版本</div><div class="hint" id="sVerHint"></div></div>
</div>

<!-- ================= 标签页 ================= -->
<div class="tabs">
  <button id="t1" class="active" onclick="tab(1)">激活码</button>
  <button id="t2" onclick="tab(2)">设备</button>
  <button id="t3" onclick="tab(3)">事件日志</button>
  <button id="t4" onclick="tab(4)">用户反馈</button>
  <button id="t5" onclick="tab(5)">发布更新</button>
</div>

<!-- 激活码 -->
<div id="p1" class="panel show">
  <div class="card">
    <h2>生成激活码</h2>
    <div class="row">
      <div><label>备注（买家昵称等，方便识别）</label><input id="genNote" placeholder="如：买家 A"></div>
      <div class="fix" style="width:160px"><label>有效期（天，留空 = 永久）</label><input id="genDays" type="number" min="1" max="3650" placeholder="永久"></div>
      <div class="fix" style="width:170px"><label>设备上限（1–999 台）</label><input id="genMax" type="number" value="1" min="1" max="999"></div>
      <div class="fix"><button class="btn-primary" onclick="genCode()">生成激活码</button></div>
    </div>
    <div class="code-box" id="genOut" style="display:none" onclick="copyCode()" title="点击复制"></div>
    <div class="msg" id="genMsg"></div>
  </div>

  <div class="card" id="codesCard">
    <h2>激活码列表 <span class="mut" id="codesCount"></span></h2>
    <div class="msg" id="codesMsg"></div>
  </div>
</div>

<!-- 设备 -->
<div id="p2" class="panel">
  <div class="card">
    <h2>全部设备 <span class="mut" style="font-weight:400">按激活码分组，含最近一次心跳上报的使用状态</span></h2>
    <div id="devWrap"></div>
  </div>
</div>

<!-- 日志 -->
<div id="p3" class="panel">
  <div class="card">
    <h2>事件日志</h2>
    <div class="timeline" id="logWrap"></div>
  </div>
</div>

<!-- 反馈 -->
<div id="p4" class="panel">
  <div class="card">
    <h2>用户反馈</h2>
    <table>
      <thead><tr><th>时间</th><th>激活码</th><th>设备</th><th>内容</th></tr></thead>
      <tbody id="fbBody"></tbody>
    </table>
  </div>
</div>

<!-- 更新 -->
<div id="p5" class="panel">
  <div class="card">
    <h2>发布新版本</h2>
    <div class="row">
      <div><label>版本号</label><input id="upVer" placeholder="如 2.5.1"></div>
      <div><label>下载链接</label><input id="upUrl" placeholder="https://…/AtmosX-2.5.1.dmg"></div>
    </div>
    <div><label>更新说明（会推送给已激活设备）</label><textarea id="upNotes" rows="3" placeholder="本次修复内容…"></textarea></div>
    <div style="margin-top:12px"><button class="btn-primary" onclick="pubUpdate()">发布版本</button></div>
    <div class="msg" id="upMsg"></div>
    <details style="margin-top:8px"><summary>查看当前已发布版本</summary>
      <div class="mono mut" id="curVer" style="margin-top:8px;white-space:pre-wrap"></div>
    </details>
  </div>
</div>

<div class="foot">
  <span>服务器时间 <span class="mono" id="sTime">–</span></span>
  <span>AtmosX License Service · cn-hangzhou</span>
</div>

<div class="toast" id="toast"></div>

<script>
var BASE = "https://atmosx-license-atmosx-txlskfpdas.cn-hangzhou.fcapp.run";
var DEFAULT_KEY = "";
var KEY = (localStorage.getItem("atmosxAdminKey") || "").trim();

/* 每次请求优先读输入框当前值，避免旧错误密钥锁死 localStorage */
function currentKey() {
  var inp = document.getElementById("keyInput");
  var v = inp && inp.value ? inp.value.trim() : "";
  return v || KEY || "";
}

function toast(msg, cls, ms) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + (cls || "");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = "toast"; }, ms || 2600);
}

function setConn(cls, txt) {
  var b = document.getElementById("connBtn");
  b.className = "btn-primary" + (cls ? " " + cls : "");
  b.textContent = txt;
  var st = document.getElementById("connHint");
  st.className = "status" + (cls === "ok" ? " ok" : (cls === "bad" ? " err" : ""));
  st.innerHTML = '<span class="dot"></span>' + (cls === "ok" ? "已连接 · 服务正常" : (cls === "bad" ? "连接失败" : "未连接"));
}

/* 连接：校验密钥有效性后再保存 */
function saveKey() {
  KEY = document.getElementById("keyInput").value.trim();
  if (!KEY) { toast("请输入管理员密钥", "err"); setConn("", "未连接"); return; }
  document.getElementById("keyInput").value = KEY;
  setConn("", "连接中…");
  api("/api/admin/stats").then(function (s) {
    if (s.ok) {
      localStorage.setItem("atmosxAdminKey", KEY);
      setConn("ok", "已授权");
      loadAll();
    } else {
      setConn("bad", "重试");
      toast("密钥无效：" + (s.error || "未授权") + "（请核对管理员密钥）", "err", 4500);
    }
  });
}
function clearKey() {
  KEY = "";
  document.getElementById("keyInput").value = "";
  localStorage.removeItem("atmosxAdminKey");
  setConn("", "未连接");
  toast("已清除本机保存的密钥");
}

/* 请求层：x-admin-key 每次取 currentKey；解析失败/断网给明确提示 */
function api(path, body) {
  return fetch(BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "x-admin-key": currentKey() },
    body: body ? JSON.stringify(body) : "{}",
  }).then(function (r) {
    return r.json().catch(function () { return { ok: false, error: "HTTP " + r.status + "，响应无法解析" }; });
  }).catch(function (e) {
    return { ok: false, error: "网络错误：" + e.message };
  });
}

/* HTML 转义：含单/双引号，防止设备名中的 ' 或 " 破坏 onclick 属性 */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function fmtTime(ts) {
  if (!ts) return "–";
  var d = new Date(ts * 1000);
  var p = function (x) { return String(x).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function fmtShort(ts) {
  if (!ts) return "–";
  var d = new Date(ts * 1000);
  var p = function (x) { return String(x).padStart(2, "0"); };
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function pct(x) { return (Math.round(x * 1000) / 10) + "%"; }

function tab(n) {
  for (var i = 1; i <= 5; i++) {
    document.getElementById("p" + i).classList.toggle("show", i === n);
    document.getElementById("t" + i).classList.toggle("active", i === n);
  }
  if (n === 2) loadDevices();
  if (n === 3) loadLogs();
  if (n === 4) loadFeedback();
}

function loadAll() {
  var cur = currentKey();
  document.getElementById("keyInput").value = cur;
  loadStats();
  loadCodes();
  loadVersion();
  loadPresetSummary();
}

/* 顶栏连接状态在 loadStats 里更新 */
function loadStats() {
  api("/api/admin/stats").then(function (s) {
    if (!s.ok) {
      setConn("bad", "重试");
      toast(s.error || "统计失败", "err");
      return;
    }
    setConn("ok", "已授权");
    document.getElementById("sCodes").textContent = s.codes;
    document.getElementById("sDevices").textContent = s.devices;
    document.getElementById("sOnline").textContent = s.online;
    document.getElementById("sCodesHint").textContent = s.totalLimit ? ("服务端容量 " + s.totalLimit) : "";
    document.getElementById("sDevicesHint").textContent = s.version ? ("当前 v" + s.version.version) : "";
    document.getElementById("sTime").textContent = s.serverTime ? fmtTime(s.serverTime) : "–";
    if (s.version) {
      document.getElementById("sVer").textContent = "v" + s.version.version;
      document.getElementById("sVerHint").textContent = "发布于 " + fmtShort(s.version.pubDate);
    } else {
      document.getElementById("sVer").textContent = "–";
      document.getElementById("sVerHint").textContent = "尚未发布版本";
    }
  });
}

function loadPresetSummary() {
  api("/api/admin/devices").then(function (d) {
    var el = document.getElementById("sPreset");
    if (!d.ok || !d.rows) { el.textContent = "–"; return; }
    var counts = {};
    var total = 0;
    d.rows.forEach(function (r) {
      (r.devices || []).forEach(function (v) {
        var p = (v.preset || "未上报");
        counts[p] = (counts[p] || 0) + 1;
        total++;
      });
    });
    var parts = Object.keys(counts).map(function (k) { return k + " ×" + counts[k]; });
    el.textContent = total ? parts.slice(0, 3).join("  ") : "–";
    document.getElementById("sPresetHint").textContent = total ? ("共 " + total + " 台设备上报") : "设备尚未上报使用信息";
  });
}

function expText(ts) {
  if (!ts) return "永久";
  var left = ts - Math.floor(Date.now() / 1000);
  if (left <= 0) return '<span style="color:#fca5a5">已过期</span>';
  var d = Math.ceil(left / 86400);
  return d > 1 ? "剩 " + d + " 天" : "剩 " + Math.ceil(left / 3600) + " 小时";
}

function useLine(v) {
  var extra = '<div class="mut" style="font-size:10.5px;margin-top:2px">' + esc(v.preset || "—") + (v.output ? " · " + esc(v.output) : "") + "</div>";
  if (v.offline) {
    return extra + '<div style="margin-top:2px"><span class="pill warn"><span class="d"></span>离网模式</span></div>';
  }
  return extra;
}

/* 激活码卡片：表头语义化（占用 → 绑定进度） */
function codeRow(r) {
  var devs = (r.devices || []).map(function (v) {
    return '<tr class="devsub"><td></td><td>' + esc(v.name) + useLine(v) + '</td>' +
      '<td class="mono mut" style="font-size:11px">' + esc(v.deviceId) + '</td>' +
      '<td class="mono">' + fmtShort(v.activatedAt) + '</td><td class="mono">' + fmtShort(v.lastSeen) + '</td>' +
      '<td><span class="pill ' + (v.offline ? "warn" : (v.online ? "on" : "gray")) + '"><span class="d"></span>' + (v.offline ? "离网中" : (v.online ? "在线" : "离线")) + '</span></td>' +
      '<td><button class="btn-ghost btn-sm" data-act="unbind" data-code="' + esc(r.code) + '" data-id="' + esc(v.deviceId) + '" data-name="' + esc(v.name) + '">解绑</button></td></tr>';
  }).join("");
  var rate = r.maxDevices ? Math.min(Math.round((r.deviceCount || 0) / r.maxDevices * 100), 100) : 0;
  return '<div style="margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden">' +
    '<table><thead><tr><th style="width:250px">激活码</th><th>备注</th><th>已绑定</th><th>绑定进度</th><th>在线</th><th>有效期</th><th>创建时间</th><th>操作</th></tr></thead>' +
    '<tbody><tr><td class="mono" style="color:#7dd3fc">' + esc(r.code) + '</td>' +
    '<td>' + esc(r.note || "–") + '</td>' +
    '<td class="mono">' + (r.deviceCount || 0) + ' / ' + r.maxDevices + ' 台</td>' +
    '<td><span class="bar2"><i style="width:' + rate + '%"></i></span><span class="bar-label">' + rate + '%</span></td>' +
    '<td><span class="pill ' + (r.online ? "on" : "gray") + '"><span class="d"></span>' + (r.online || 0) + ' 台</span></td>' +
    '<td class="mono mut">' + expText(r.expiresAt) + '</td>' +
    '<td class="mono mut">' + fmtShort(r.created) + '</td>' +
    '<td><div class="btnrow">' +
    '<span style="display:flex;gap:5px;align-items:center"><input id="max_' + esc(r.code) + '" type="number" class="mono" min="1" max="999" value="' + r.maxDevices + '" style="width:64px;padding:5px 7px">' +
    '<button class="btn-ghost btn-sm" data-act="setmax" data-code="' + esc(r.code) + '">改上限</button></span>' +
    '<button class="btn-ghost btn-sm" data-act="setnote" data-code="' + esc(r.code) + '">改备注</button>' +
    '<button class="btn-danger btn-sm" data-act="unbindall" data-code="' + esc(r.code) + '">清空绑定</button></div></td></tr>' + devs + '</tbody></table></div>';
}

function loadCodes() {
  api("/api/admin/devices").then(function (d) {
    var wrap = document.getElementById("codesCard");
    var old = document.getElementById("codesInner");
    if (old) old.remove();
    var inner = document.createElement("div");
    inner.id = "codesInner";
    if (!d.ok) {
      inner.innerHTML = '<div class="empty">' + esc(d.error || "加载失败") + '</div>';
    } else if (!d.rows || !d.rows.length) {
      inner.innerHTML = '<div class="empty">暂无激活码，先生成一个</div>';
    } else {
      document.getElementById("codesCount").textContent = "共 " + d.rows.length + " 个";
      inner.innerHTML = d.rows.map(codeRow).join("");
    }
    wrap.appendChild(inner);
  });
}

function copyCode() {
  var el = document.getElementById("genOut");
  if (!el.textContent) return;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(el.textContent).then(function () { toast("已复制到剪贴板", "ok"); });
  } else {
    toast("请手动复制", "", 1600);
  }
}

function setMax(code) {
  var v = document.getElementById("max_" + code).value;
  api("/api/admin/code", { code: code, maxDevices: parseInt(v, 10) }).then(function (r) {
    if (r.ok) { toast("设备上限已更新为 " + r.maxDevices + " 台", "ok"); loadAll(); }
    else toast(r.error || "更新失败", "err");
  });
}

function setNote(code) {
  var note = prompt("修改备注：", "");
  if (note === null) return;
  api("/api/admin/code", { code: code, note: note }).then(function (r) {
    if (r.ok) { toast("备注已更新", "ok"); loadAll(); }
    else toast(r.error || "更新失败", "err");
  });
}

function unbindOne(code, devId, name) {
  if (!confirm("确认解绑设备「" + name + "」？\n\n解绑后该设备需要重新激活才能继续使用。")) return;
  api("/api/admin/code", { code: code, unbindDeviceId: devId }).then(function (r) {
    if (r.ok) { toast("已解绑「" + (r.name || name) + "」", "ok"); loadAll(); }
    else toast(r.error || "解绑失败", "err");
  });
}

function unbindAll(code) {
  if (!confirm("确认清空激活码 " + code + " 的全部绑定？\n\n所有已绑定设备都需要重新激活。")) return;
  api("/api/admin/code", { code: code, unbind: "all" }).then(function (r) {
    if (r.ok) { toast("已清空 " + r.unbound + " 台设备绑定", "ok"); loadAll(); }
    else toast(r.error || "操作失败", "err");
  });
}

function genCode() {
  var note = document.getElementById("genNote").value.trim();
  var max = parseInt(document.getElementById("genMax").value, 10) || 1;
  var days = parseInt(document.getElementById("genDays").value, 10);
  if (max < 1 || max > 999) { toast("设备上限需在 1-999 之间", "err"); return; }
  api("/api/admin/gencode", { note: note, maxDevices: max, days: days && days > 0 ? days : null }).then(function (r) {
    if (r.ok) {
      var el = document.getElementById("genOut");
      el.style.display = "inline-block";
      el.textContent = r.code;
      toast("已生成，点激活码可复制", "ok");
      document.getElementById("genNote").value = "";
      document.getElementById("genDays").value = "";
      loadAll();
    } else toast(r.error || "生成失败", "err");
  });
}

function loadDevices() {
  api("/api/admin/devices").then(function (d) {
    var w = document.getElementById("devWrap");
    if (!d.ok) { w.innerHTML = '<div class="empty">' + esc(d.error || "加载失败") + '</div>'; return; }
    var rows = [];
    (d.rows || []).forEach(function (r) {
      (r.devices || []).forEach(function (v) {
        rows.push("<tr><td class='mono'>" + esc(r.code) + "</td><td>" + esc(v.name) + useLine(v) + "</td>" +
          "<td class='mono mut' style='font-size:11px'>" + esc(v.deviceId) + "</td>" +
          "<td class='mono'>" + fmtShort(v.activatedAt) + "</td><td class='mono'>" + fmtShort(v.lastSeen) + "</td>" +
          "<td><span class='pill " + (v.offline ? "warn" : (v.online ? "on" : "gray")) + "'><span class='d'></span>" + (v.offline ? "离网中" : (v.online ? "在线" : "离线")) + "</span></td>" +
          "<td><button class='btn-ghost btn-sm' data-act='unbind' data-code='" + esc(r.code) + "' data-id='" + esc(v.deviceId) + "' data-name='" + esc(v.name) + "' >解绑</button></td></tr>");
      });
    });
    w.innerHTML = rows.length
      ? "<table><thead><tr><th>激活码</th><th>设备名</th><th>设备 ID</th><th>激活时间</th><th>最后在线</th><th>状态</th><th>操作</th></tr></thead><tbody>" + rows.join("") + "</tbody></table>"
      : '<div class="empty">暂无绑定设备</div>';
  });
}

function loadLogs() {
  api("/api/admin/logs").then(function (d) {
    var w = document.getElementById("logWrap");
    if (!d.ok) { w.innerHTML = '<div class="empty">' + esc(d.error || "加载失败") + '</div>'; return; }
    var types = { activate: "激活", gencode: "生成", unbind: "解绑", limit: "上限", release: "发布", feedback: "反馈" };
    var items = (d.rows || []).map(function (r) {
      var t = types[r.type] || r.type;
      return '<div class="tl-item"><div class="t"><span class="badge">' + esc(t) + '</span>' +
        '<span class="mono" style="font-size:11px">' + esc(r.code || "") + '</span> <span>' + esc(r.msg || "") + '</span></div>' +
        '<div class="d">' + fmtTime(r.time) + '</div></div>';
    }).join("");
    w.innerHTML = items || '<div class="empty">暂无事件记录</div>';
  });
}

function loadFeedback() {
  api("/api/admin/feedback").then(function (f) {
    var b = document.getElementById("fbBody");
    if (!f.ok) { b.innerHTML = '<tr><td colspan="4" class="empty">' + esc(f.error || "加载失败") + '</td></tr>'; return; }
    b.innerHTML = (f.rows || []).map(function (x) {
      return "<tr><td class='mono'>" + fmtTime(x.time) + "</td><td class='mono'>" + esc(x.code) + "</td>" +
        "<td>" + esc(x.deviceName) + "</td><td>" + esc(x.message) +
        (x.report ? "<pre style='white-space:pre-wrap;font-size:11px;color:var(--mut)'>" + esc(x.report) + "</pre>" : "") + "</td></tr>";
    }).join("") || '<tr><td colspan="4" class="empty">暂无反馈</td></tr>';
  });
}

function loadVersion() {
  // 线上公开版不携带激活码，版本信息直接取统计接口
  api("/api/admin/stats").then(function (st) {
    var el = document.getElementById("curVer");
    var v = st.ok && st.version;
    if (v && v.version) el.textContent = "v" + v.version + "（发布于 " + fmtTime(v.pubDate) + "）";
    else el.textContent = "暂无已发布版本";
  });
}

function pubUpdate() {
  var version = document.getElementById("upVer").value.trim();
  var url = document.getElementById("upUrl").value.trim();
  var notes = document.getElementById("upNotes").value.trim();
  if (!version) { toast("请填版本号", "err"); return; }
  api("/api/admin/update", { version: version, url: url, notes: notes }).then(function (r) {
    if (r.ok) { toast("已发布 v" + r.version, "ok"); loadAll(); }
    else toast(r.error || "发布失败", "err");
  });
}

/* 启动自愈：存的密钥若验证不过且不是默认密钥，自动切回默认密钥 */
function bootCheck(k) {
  if (!k) { setConn("", "未连接"); return; }
  api("/api/admin/stats").then(function (s) {
    if (s.ok) { KEY = k; setConn("ok", "已授权"); loadAll(); return; }
    setConn("bad", "重试");
    toast("密钥无效：" + (s.error || "未授权"), "err", 4000);
  });
}

/* 全局事件委托：动态渲染的行内按钮（解绑/改上限/改备注/清空绑定） */
document.addEventListener("click", function (e) {
  var el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  if (act === "unbind") unbindOne(el.getAttribute("data-code"), el.getAttribute("data-id"), el.getAttribute("data-name"));
  else if (act === "unbindall") unbindAll(el.getAttribute("data-code"));
  else if (act === "setmax") setMax(el.getAttribute("data-code"));
  else if (act === "setnote") setNote(el.getAttribute("data-code"));
});

document.addEventListener("DOMContentLoaded", function () {
  var stored = currentKey();
  document.getElementById("keyInput").value = stored;
  document.getElementById("keyInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); saveKey(); }
  });
  bootCheck(stored);
});
</script>
</body>
</html>
